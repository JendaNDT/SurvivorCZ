# Automatické sestavení APK pro Android.
# Spustí se při každém pushi do main, nebo ručně v záložce Actions → "Android APK" → Run workflow.
# Hotové APK najdeš v detailu běhu v sekci Artifacts.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Stáhnout Godot a šablony pro export
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $T
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz templates/android_release.apk templates/android_debug.apk templates/version.txt -d $T
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Nastavit Android SDK pro Godot
        run: |
          mkdir -p ~/.config/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/sideload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: dobyjcesko
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: dobyjcesko
        run: |
          ./godot --headless --path . --import || true
          mkdir -p build
          ./godot --headless --path . --export-release "Android" build/DobyjCesko.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: DobyjCesko-apk
          path: build/DobyjCesko.apk
